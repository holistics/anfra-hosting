# anfra on your own server: copy .env.example to .env and fill it in, then `docker compose up -d`.
# Put an HTTPS proxy in front of 127.0.0.1:8080: sign-in only works over HTTPS.
services:
  anfra:
    build: .
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080   # only this machine can reach it
    env_file: .env
    volumes:
      # Your database credentials: a data_sources.yml next to this file, never committed.
      - ./data_sources.yml:/etc/secrets/data_sources.yml:ro

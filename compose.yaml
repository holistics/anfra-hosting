# anfra on your own server: put the users in .env (see .env.example), then `docker compose up -d`.
# Put an HTTPS proxy in front of 127.0.0.1:8080: sign-in only works over HTTPS.
services:
  anfra:
    build: .
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080   # only this machine can reach it
    volumes:
      - .:/repo   # anfra reads the project folder, so `git pull` updates it
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      LOGIN_USERS: ${LOGIN_USERS}

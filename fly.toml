# Fly.io config for anfra. Run `fly launch --no-deploy`, keep this configuration,
# set LOGIN_USERS, ANFRA_PROJECT_REPO and, for a private repo, ANFRA_PROJECT_TOKEN
# with `fly secrets set`, then `fly deploy --ha=false`.
app = "anfra"

[http_service]
  internal_port = 8080   # the port the image listens on
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep one machine running, so people stay signed in

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"   # the default 256mb is too small

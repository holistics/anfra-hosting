# Render Blueprint for anfra. In Render: New > Blueprint, then connect this repo.
services:
  - type: web
    name: anfra
    runtime: docker
    # Pick the region closest to your database: oregon, ohio, virginia, frankfurt or singapore.
    region: oregon
    # free sleeps when nobody uses it. Pick another instance type in Render to keep it awake.
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Who can sign in: name:password pairs separated by commas. Render asks for it.
      - key: LOGIN_USERS
        sync: false
      # Your database credentials: add ANFRA_DATA_SOURCES in the service's Environment tab,
      # with the contents of your .anfra/data_sources.yml. Without it, anfra uses
      # .anfra/data_sources.yml.example, which is enough for this sample's DuckDB file.

name: Publish image

# Builds ghcr.io/holistics/anfra-hosting from image/, checks it with the smoke test,
# then pushes it tagged with the anfra version it is built on.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["image/**"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and check
        run: .github/smoke-test.sh
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's|^FROM ghcr.io/holistics/anfra:\([0-9.]*\)$|\1|p' image/Dockerfile)
          [ -n "$version" ] || { echo "no anfra version in image/Dockerfile"; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/holistics/anfra-hosting:0.24.0 "ghcr.io/holistics/anfra-hosting:$version"
          docker push "ghcr.io/holistics/anfra-hosting:$version"
